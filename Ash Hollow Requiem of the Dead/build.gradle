plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0.0'
group = 'com.yourname.ash_hollow'
archivesBaseName = 'ash_hollow_requiem_of_the_dead'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                ash_hollow_requiem_of_the_dead {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                ash_hollow_requiem_of_the_dead {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
}

repositories {
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.3")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var replaceProps = [
        'minecraft_version': '1.20.1',
        'minecraft_version_range': '[1.20.1,1.21)',
        'forge_version': '47.4.0',
        'forge_version_range': '[47,)',
        'loader_version_range': '[47,)',
        'mod_id': 'ash_hollow_requiem_of_the_dead',
        'mod_name': 'Ash Hollow: Requiem of the Dead',
        'mod_license': 'All Rights Reserved',
        'mod_version': project.version,
        'mod_authors': 'YourName',
        'mod_description': 'Ash Hollow: Requiem of the Dead\\n\\nA dark and atmospheric mod with vision enhancement capabilities.'
    ]
    
    inputs.properties replaceProps

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProps
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'ash_hollow_requiem_of_the_dead',
            'Specification-Vendor'    : 'YourName',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'YourName',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}